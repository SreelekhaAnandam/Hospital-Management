<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Checklist | Smart HealthCare</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: #f5faff;
        margin: 0;
        color: #333;
      }

      header {
        background: linear-gradient(135deg, #0077b6, #00b4d8);
        color: white;
        padding: 20px;
        text-align: center;
        font-size: 1.6rem;
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      form {
        background: white;
        max-width: 800px;
        margin: 40px auto;
        padding: 30px 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      h2 {
        color: #0077b6;
        text-align: center;
        margin-bottom: 25px;
      }

      label {
        display: block;
        font-weight: 600;
        margin-top: 10px;
      }

      input[type="text"],
      input[type="number"],
      select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      .symptoms {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-top: 15px;
      }

      .symptom-item {
        background: #f1faff;
        border: 1px solid #cce7ff;
        padding: 10px;
        border-radius: 10px;
      }

      .submit-btn {
        background: #0077b6;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 10px;
        font-size: 1rem;
        cursor: pointer;
        font-weight: 600;
        width: 100%;
        margin-top: 25px;
        transition: 0.3s;
      }

      .submit-btn:hover {
        background: #023e8a;
      }
    </style>
  </head>
  <body>
    <header>🧍‍♂️ Patient System Health Checklist</header>

    <form id="checklistForm">
      <h2>Fill Out Your Health Details</h2>

      <label>Full Name:</label>
      <input type="text" id="name" required />

      <label>Age:</label>
      <input type="number" id="age" required />

      <label>Gender:</label>
      <select id="gender" required>
        <option value="">Select</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>

      <label>Blood Group:</label>
      <select id="bloodGroup" required>
        <option value="">Select</option>
        <option>A+</option>
        <option>A-</option>
        <option>B+</option>
        <option>B-</option>
        <option>O+</option>
        <option>O-</option>
        <option>AB+</option>
        <option>AB-</option>
      </select>

      <label>Select Your Current Symptoms:</label>
      <div class="symptoms">
        <label class="symptom-item"
          ><input type="checkbox" value="Fever" /> Fever</label
        >
        <label class="symptom-item"
          ><input type="checkbox" value="Cough" /> Cough</label
        >
        <label class="symptom-item"
          ><input type="checkbox" value="Headache" /> Headache</label
        >
        <label class="symptom-item"
          ><input type="checkbox" value="Fatigue" /> Fatigue</label
        >
        <label class="symptom-item"
          ><input type="checkbox" value="Body Pain" /> Body Pain</label
        >
        <label class="symptom-item"
          ><input type="checkbox" value="Breathing Difficulty" /> Breathing
          Difficulty</label
        >
        <label class="symptom-item"
          ><input type="checkbox" value="Chest Pain" /> Chest Pain</label
        >
        <label class="symptom-item"
          ><input type="checkbox" value="Nausea" /> Nausea</label
        >
        <label class="symptom-item"
          ><input type="checkbox" value="Dizziness" /> Dizziness</label
        >
        <label class="symptom-item"
          ><input type="checkbox" value="Loss of Appetite" /> Loss of
          Appetite</label
        >
        <label class="symptom-item"
          ><input type="checkbox" value="Vision Problem" /> Vision
          Problem</label
        >
        <label class="symptom-item"
          ><input type="checkbox" value="Allergy" /> Allergy</label
        >
      </div>

      <button type="submit" class="submit-btn">Submit Checklist</button>
    </form>

    <script>
      document
        .getElementById("checklistForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const name = document.getElementById("name").value;
          const age = document.getElementById("age").value;
          const gender = document.getElementById("gender").value;
          const bloodGroup = document.getElementById("bloodGroup").value;

          const symptoms = Array.from(
            document.querySelectorAll(".symptoms input:checked")
          ).map((sym) => sym.value);

          const patientData = {
            name,
            age,
            gender,
            bloodGroup,
            symptoms,
          };

          localStorage.setItem("patientChecklist", JSON.stringify(patientData));
          window.location.href = "healthSummary.html";
        });
    </script>
  </body>
</html>

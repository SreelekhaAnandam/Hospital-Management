    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(120deg, #caf0f8, #e0f7f9);
        color: #003049;
        padding: 2rem;
        text-align: center;
      }

      .container {
        max-width: 1100px;
        margin: auto;
        background: white;
        padding: 2rem;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      }

      h1 {
        color: #0077b6;
        margin-bottom: 1rem;
      }

      .doctor-card {
        background: linear-gradient(120deg, #f0faff, #ffffff);
        padding: 20px;
        margin: 15px 0;
        border-radius: 12px;
        text-align: left;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s;
      }

      .doctor-card:hover {
        transform: scale(1.02);
      }

      .doctor-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .doctor-name {
        font-size: 1.3rem;
        font-weight: 600;
        color: #0077b6;
      }

      .schedule {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 10px;
      }

      .slot {
        background: #d0f0fd;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
        font-size: 0.9rem;
      }

      .slot:hover {
        background: #0077b6;
        color: white;
      }

      .slot.booked {
        background: #ffcccc;
        color: #800000;
        cursor: not-allowed;
      }

      .slot.booked:hover {
        background: #ffcccc;
        color: #800000;
      }

      .availability {
        font-weight: 600;
        margin-top: 8px;
        color: #0077b6;
      }

      button.back {
        background: #0077b6;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 20px;
        transition: 0.3s;
      }

      button.back:hover {
        background: #023e8a;
      }
    </style>
  </head>

      if (!appointmentInfo) {
        doctorListDiv.innerHTML =
          "<p>No appointment details found. Please go back.</p>";
      } else {
        const { hospital, disease, date, time } = appointmentInfo;
        const doctors = hospitalDoctors[hospital].filter(
          (d) => d.specialization === disease
        );

        const appointments =
          JSON.parse(localStorage.getItem("appointments")) || [];

        if (doctors.length === 0) {
          alert(
            `No doctors available for ${disease} at ${hospital} on this day. Please choose another day.`
          );
          window.location.href = "patient.html";
        } else {
          doctors.forEach((d) => {
            const div = document.createElement("div");
            div.className = "doctor-card";

            // generate slots (from 09:00 to 17:00, 30-minute intervals)
            const slots = [];
            for (let h = 9; h <= 17; h++) {
              slots.push(`${String(h).padStart(2, "0")}:00`);
              if (h < 17) slots.push(`${String(h).padStart(2, "0")}:30`);
            }

            let slotHTML = "";
            slots.forEach((slot) => {
              const isBooked = appointments.some(
                (a) =>
                  a.doctor === d.name &&
                  a.hospital === hospital &&
                  a.time === slot
              );
              slotHTML += `<div class="slot ${
                isBooked ? "booked" : ""
              }" onclick="bookSlot('${
                d.name
              }', '${slot}', ${isBooked})">${slot}</div>`;
            });

            div.innerHTML = `
            <div class="doctor-header">
              <div class="doctor-name">${d.name}</div>
              <div><b>${d.specialization}</b> | ${d.exp} | ⭐ ${d.rating}</div>
            </div>
            <div class="availability">Available Time Slots:</div>
            <div class="schedule">${slotHTML}</div>
          `;

            doctorListDiv.appendChild(div);
          });
        }
      }

      function bookSlot(doctorName, slot, isBooked) {
        if (isBooked) {
          alert(
            `Dr. ${doctorName} is already scheduled at ${slot}. Please choose another time.`
          );
          return;
        }

        const { hospital, disease } = JSON.parse(
          sessionStorage.getItem("appointmentInfo")
        );
        const appointments =
          JSON.parse(localStorage.getItem("appointments")) || [];

        const appointmentData = {
          doctor: doctorName,
          hospital,
          disease,
          time: slot,
          patient: "Guest",
          paymentStatus: "Pending",
        };

        appointments.push(appointmentData);
        localStorage.setItem("appointments", JSON.stringify(appointments));
        sessionStorage.setItem(
          "confirmedAppointment",
          JSON.stringify(appointmentData)
        );

        window.location.href = "confirmation.html";
      }

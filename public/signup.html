<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hospital Signup</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(120deg, #cce5ff, #e6fff5);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px 0;
      }
      .signup-box {
        background: white;
        padding: 40px 50px;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        width: 380px;
        text-align: center;
        max-height: 90vh;
        overflow-y: auto;
      }
      h1 {
        margin-bottom: 25px;
        color: #0077b6;
      }
      label {
        display: block;
        text-align: left;
        margin-bottom: 5px;
        color: #333;
        font-weight: 500;
      }
      input,
      select {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 1rem;
        outline: none;
        transition: border 0.2s;
        box-sizing: border-box;
      }
      input:focus,
      select:focus {
        border-color: #0077b6;
      }
      button {
        width: 100%;
        padding: 10px;
        background: #0077b6;
        color: white;
        font-size: 1rem;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.3s;
      }
      button:hover {
        background: #023e8a;
      }
      .footer {
        margin-top: 20px;
        color: #555;
        font-size: 0.9rem;
      }
      #doctorFields {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 2px solid #e0e0e0;
      }
    </style>
  </head>
  <body>
    <div class="signup-box">
      <h1>Sign Up Portal</h1>
      <form id="signupForm">
        <div id="message" style="height:1.2rem;margin-bottom:8px;color:#b00020"></div>
        <label for="role">Select Role:</label>
        <select id="role" required>
          <option value="">-- Select Role --</option>
          <option value="patient" selected>Patient</option>
          <option value="doctor">Doctor</option>
          <option value="admin">Admin</option>
        </select>

        <input type="text" id="name" placeholder="Full Name" required />
        <input type="email" id="email" placeholder="Email" required />
        <input type="text" id="username" placeholder="Username" required />
        <input type="password" id="password" placeholder="Password" required />
        
        <!-- Doctor-specific fields -->
        <div id="doctorFields" style="display: none;">
          <label for="specialization">Specialization:</label>
          <select id="specialization">
            <option value="">-- Select Specialization --</option>
            <option value="Cardiology">Cardiology</option>
            <option value="Dermatology">Dermatology</option>
            <option value="Neurology">Neurology</option>
            <option value="Orthopedics">Orthopedics</option>
            <option value="Pediatrics">Pediatrics</option>
            <option value="Psychiatry">Psychiatry</option>
            <option value="Radiology">Radiology</option>
            <option value="General Surgery">General Surgery</option>
            <option value="Internal Medicine">Internal Medicine</option>
            <option value="Obstetrics & Gynecology">Obstetrics & Gynecology</option>
            <option value="Ophthalmology">Ophthalmology</option>
            <option value="ENT">ENT (Ear, Nose, Throat)</option>
            <option value="Anesthesiology">Anesthesiology</option>
            <option value="Emergency Medicine">Emergency Medicine</option>
            <option value="Oncology">Oncology</option>
          </select>

          <label for="hospitals">Select Hospitals (Hold Ctrl/Cmd for multiple):</label>
          <select id="hospitals" multiple style="height: 100px;">
            <option value="Apollo Hospitals">Apollo Hospitals</option>
            <option value="Fortis Healthcare">Fortis Healthcare</option>
            <option value="AIIMS">AIIMS</option>
          </select>
        </div>

        <button type="submit">Sign Up</button>
      </form>
      <div class="footer">
        <p>Already have an account? <a href="login.html">Login</a></p>
        © 2025 Hospital Management System
      </div>
    </div>

    <script>
      // Show/hide doctor fields based on role selection
      document.getElementById("role").addEventListener("change", function() {
        const doctorFields = document.getElementById("doctorFields");
        const specialization = document.getElementById("specialization");
        const hospitals = document.getElementById("hospitals");
        
        if (this.value === "doctor") {
          doctorFields.style.display = "block";
          specialization.required = true;
        } else {
          doctorFields.style.display = "none";
          specialization.required = false;
          specialization.value = "";
          // Clear hospital selections
          Array.from(hospitals.options).forEach(option => option.selected = false);
        }
      });

      document
        .getElementById("signupForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const role = document.getElementById("role").value;
          const name = document.getElementById("name").value.trim();
          const email = document.getElementById("email").value.trim();
          const username = document.getElementById("username").value.trim();
          const password = document.getElementById("password").value.trim();

          if (!role) {
            document.getElementById('message').textContent = "Please select your role!";
            return;
          }

          // Prepare request body
          const requestBody = { username, password, role, name, email };

          // Add doctor-specific data if role is doctor
          if (role === "doctor") {
            const specialization = document.getElementById("specialization").value;
            const hospitalsSelect = document.getElementById("hospitals");
            const selectedHospitals = Array.from(hospitalsSelect.selectedOptions).map(option => option.value);

            if (!specialization) {
              document.getElementById('message').textContent = "Please select a specialization!";
              return;
            }

            if (selectedHospitals.length === 0) {
              document.getElementById('message').textContent = "Please select at least one hospital!";
              return;
            }

            requestBody.specialization = specialization;
            requestBody.hospitals = selectedHospitals;
          }

          try {
            // Use server URL
            const apiBase = 'http://localhost:5000';
            const response = await fetch(`${apiBase}/api/auth/register`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(requestBody),
            });

            const data = await response.json();

            if (response.ok) {
              document.getElementById('message').style.color = '#007700';
              document.getElementById('message').textContent = 'Account created successfully! Redirecting to login...';
              setTimeout(() => (window.location.href = apiBase + '/login.html'), 900);
            } else {
              document.getElementById('message').textContent = data.message || 'Error creating account. Try again!';
            }
          } catch (error) {
            console.error("Signup error:", error);
            document.getElementById('message').textContent = "Server error. Please try again later.";
          }
        });
    </script>
  </body>
</html>

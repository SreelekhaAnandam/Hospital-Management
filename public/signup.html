<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hospital Signup</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(120deg, #cce5ff, #e6fff5);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .signup-box {
        background: white;
        padding: 40px 50px;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        width: 380px;
        text-align: center;
      }
      h1 {
        margin-bottom: 25px;
        color: #0077b6;
      }
      input,
      select {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 1rem;
        outline: none;
        transition: border 0.2s;
      }
      input:focus,
      select:focus {
        border-color: #0077b6;
      }
      button {
        width: 100%;
        padding: 10px;
        background: #0077b6;
        color: white;
        font-size: 1rem;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.3s;
      }
      button:hover {
        background: #023e8a;
      }
      .footer {
        margin-top: 20px;
        color: #555;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="signup-box">
      <h1>Sign Up Portal</h1>
      <form id="signupForm">
        <div id="message" style="height:1.2rem;margin-bottom:8px;color:#b00020"></div>
        <label for="role">Select Role:</label>
        <select id="role" required>
          <option value="">-- Select Role --</option>
          <option value="patient" selected>Patient</option>
          <option value="doctor">Doctor</option>
          <option value="admin">Admin</option>
        </select>

        <input type="text" id="name" placeholder="Full Name" required />
        <input type="email" id="email" placeholder="Email" required />
        <input type="text" id="username" placeholder="Username" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Sign Up</button>
      </form>
      <div class="footer">
        <p>Already have an account? <a href="login.html">Login</a></p>
        © 2025 Hospital Management System
      </div>
    </div>

    <script>
      document
        .getElementById("signupForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const role = document.getElementById("role").value;
          const name = document.getElementById("name").value.trim();
          const email = document.getElementById("email").value.trim();
          const username = document.getElementById("username").value.trim();
          const password = document.getElementById("password").value.trim();

          if (!role) {
            alert("Please select your role!");
            return;
          }

          try {
            // Use server URL
            const apiBase = 'http://localhost:5000';
            const response = await fetch(`${apiBase}/api/auth/register`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ username, password, role, name, email }),
            });

            const data = await response.json();

            if (response.ok) {
              document.getElementById('message').style.color = '#007700';
              document.getElementById('message').textContent = 'Account created successfully! Redirecting to login...';
              setTimeout(() => (window.location.href = apiBase + '/login.html'), 900);
            } else {
              document.getElementById('message').textContent = data.message || 'Error creating account. Try again!';
            }
          } catch (error) {
            console.error("Signup error:", error);
            alert("Server error. Please try again later.");
          }
        });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Smart HealthCare</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        background: #fff8e1;
        margin: 0;
      }

      header {
        background: linear-gradient(135deg, #ff8800, #ffa94d);
        color: white;
        text-align: center;
        padding: 20px;
        font-size: 1.6rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      .container {
        padding: 30px 60px;
        max-width: 1400px;
        margin: 0 auto;
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: #ff8800;
        font-size: 1.2rem;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .stat-card {
        background: white;
        text-align: center;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s;
      }

      .stat-card:hover {
        transform: translateY(-5px);
      }

      .stat-card h3 {
        color: #ff8800;
        font-size: 1.1rem;
        margin-bottom: 10px;
      }

      .stat-card p {
        font-size: 2rem;
        font-weight: 700;
        color: #e65100;
      }

      .section {
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        padding: 30px;
        margin-bottom: 30px;
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .section h2 {
        color: #ff8800;
        font-size: 1.5rem;
      }

      .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.95rem;
        transition: 0.3s;
      }

      .btn-primary {
        background: #ff8800;
        color: white;
      }

      .btn-primary:hover {
        background: #cc6f00;
      }

      .btn-small {
        padding: 6px 12px;
        font-size: 0.85rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.95rem;
      }

      th,
      td {
        padding: 12px 15px;
        border-bottom: 1px solid #eee;
        text-align: left;
      }

      th {
        background: #ff8800;
        color: white;
        font-size: 1rem;
        font-weight: 600;
      }

      tr:hover {
        background: #fff3cd;
      }

      .status-badge {
        padding: 5px 12px;
        border-radius: 15px;
        font-size: 0.85rem;
        font-weight: 600;
      }

      .status-pending {
        background: #fff3cd;
        color: #856404;
      }

      .status-confirmed, .status-approved {
        background: #d4edda;
        color: #155724;
      }

      .status-cancelled, .status-rejected {
        background: #f8d7da;
        color: #721c24;
      }

      .status-completed {
        background: #d1ecf1;
        color: #0c5460;
      }

      .action-buttons {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .empty-state {
        text-align: center;
        padding: 40px;
        color: #666;
      }

      .empty-state-icon {
        font-size: 3rem;
        margin-bottom: 15px;
      }

      .logout-btn {
        margin-top: 30px;
        background: #ff8800;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
      }

      .logout-btn:hover {
        background: #cc6f00;
      }

      @media (max-width: 768px) {
        .container {
          padding: 15px;
        }

        .stats {
          grid-template-columns: 1fr;
        }

        table {
          font-size: 0.85rem;
        }

        th, td {
          padding: 8px;
        }
      }
    </style>
  </head>

  <body>
    <header>🧑‍💼 Admin Dashboard</header>

    <div class="container">
      <div id="loadingBox" class="loading" style="display: none;">
        Loading dashboard data...
      </div>

      <!-- Statistics -->
      <div class="stats" id="statsSection" style="display: none;">
        <div class="stat-card">
          <h3>📅 Total Appointments</h3>
          <p id="totalAppointments">0</p>
        </div>
        <div class="stat-card">
          <h3>⏳ Pending</h3>
          <p id="pendingCount">0</p>
        </div>
        <div class="stat-card">
          <h3>✅ Confirmed</h3>
          <p id="confirmedCount">0</p>
        </div>
        <div class="stat-card">
          <h3>❌ Cancelled</h3>
          <p id="cancelledCount">0</p>
        </div>
      </div>

      <!-- Appointments Section -->
      <div class="section" id="appointmentsSection" style="display: none;">
        <div class="section-header">
          <h2>📋 All Appointments</h2>
          <button class="btn btn-primary" onclick="refreshAppointments()">
            🔄 Refresh
          </button>
        </div>
        <div id="appointmentsContent"></div>
      </div>

      <center>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </center>
    </div>

    <script src="js/api.js?v=2"></script>
    <script>
      // Check authentication
      if (!requireAuth('admin')) {
        // Will redirect if not authenticated
      }

      let appointments = [];

      // Load dashboard data
      async function loadDashboard() {
        const loadingBox = document.getElementById('loadingBox');
        loadingBox.style.display = 'block';

        try {
          // Load appointments
          await loadAppointments();

          // Show sections
          document.getElementById('statsSection').style.display = 'grid';
          document.getElementById('appointmentsSection').style.display = 'block';

        } catch (error) {
          console.error('Error loading dashboard:', error);
          alert('Error loading dashboard. Please try again.');
        } finally {
          loadingBox.style.display = 'none';
        }
      }

      // Load appointments
      async function loadAppointments() {
        try {
          // Use getMy() to get all appointments for admin
          appointments = await AppointmentAPI.getMy();
          console.log('All Appointments:', appointments);

          // Update statistics
          document.getElementById('totalAppointments').textContent = appointments.length;
          document.getElementById('pendingCount').textContent =
            appointments.filter(a => a.status === 'Pending').length;
          document.getElementById('confirmedCount').textContent =
            appointments.filter(a => a.status === 'Confirmed' || a.status === 'Approved').length;
          document.getElementById('cancelledCount').textContent =
            appointments.filter(a => a.status === 'Cancelled' || a.status === 'Rejected').length;

          // Display appointments
          displayAppointments(appointments);

        } catch (error) {
          console.error('Error loading appointments:', error);
          document.getElementById('appointmentsContent').innerHTML =
            '<div class="empty-state"><div class="empty-state-icon">⚠️</div><p>Error loading appointments. Please try again.</p></div>';
        }
      }

      // Display appointments
      function displayAppointments(appointments) {
        const content = document.getElementById('appointmentsContent');

        if (appointments.length === 0) {
          content.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📅</div>
              <p>No appointments found</p>
            </div>
          `;
          return;
        }

        let html = `
          <table>
            <thead>
              <tr>
                <th>Patient Name</th>
                <th>Age/Gender</th>
                <th>Doctor Name</th>
                <th>Disease</th>
                <th>Hospital</th>
                <th>Date & Time</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
        `;

        appointments.forEach(apt => {
          const statusClass = `status-${apt.status.toLowerCase()}`;
          const patientName = apt.patientId?.name || apt.patientName || 'Unknown Patient';
          const doctorName = apt.doctorId?.name || apt.doctorName || 'Not Assigned';
          const date = apt.appointmentDate ? new Date(apt.appointmentDate).toLocaleDateString() : (apt.meetingDate || 'N/A');
          const time = apt.appointmentTime || apt.time || 'N/A';
          const disease = apt.disease || apt.specialization || 'N/A';
          const age = apt.age || 'N/A';
          const gender = apt.gender || 'N/A';

          html += `
            <tr>
              <td><strong>${patientName}</strong></td>
              <td>${age} / ${gender}</td>
              <td>${doctorName}</td>
              <td>${disease}</td>
              <td>${apt.hospital}</td>
              <td>${date}<br/><small>${time}</small></td>
              <td><span class="status-badge ${statusClass}">${apt.status}</span></td>
              <td>
                <div class="action-buttons">
                  <button class="btn btn-primary btn-small" onclick="viewDetails('${apt._id}')">
                    👁️ View
                  </button>
                </div>
              </td>
            </tr>
          `;
        });

        html += '</tbody></table>';
        content.innerHTML = html;
      }

      // View patient details in modal
      function viewDetails(appointmentId) {
        const appointment = appointments.find(apt => apt._id === appointmentId);
        if (!appointment) {
          alert('Appointment not found');
          return;
        }

        const patientName = appointment.patientId?.name || appointment.patientName || 'Unknown';
        const patientEmail = appointment.patientId?.email || 'N/A';
        const patientContact = appointment.patientId?.contactNumber || 'N/A';
        const doctorName = appointment.doctorId?.name || appointment.doctorName || 'Not Assigned';
        const doctorEmail = appointment.doctorId?.email || 'N/A';
        const doctorSpec = appointment.doctorId?.specialization || appointment.specialization || 'N/A';
        const date = appointment.appointmentDate ? new Date(appointment.appointmentDate).toLocaleDateString() : (appointment.meetingDate || 'N/A');
        const time = appointment.appointmentTime || appointment.time || 'N/A';
        
        const modalContent = `
          <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000;" onclick="this.remove()">
            <div style="background: white; padding: 30px; border-radius: 15px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto;" onclick="event.stopPropagation()">
              <h2 style="color: #ff8800; margin-bottom: 20px;">👤 Complete Appointment Details</h2>
              
              <div style="display: grid; gap: 15px;">
                <h3 style="color: #ff8800; margin-top: 10px;">Patient Information</h3>
                
                <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; border-left: 4px solid #ff8800;">
                  <div style="color: #666; font-size: 0.9rem; margin-bottom: 5px;">Patient Name</div>
                  <div style="font-weight: 600; font-size: 1.1rem;">${patientName}</div>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                  <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                    <div style="color: #666; font-size: 0.9rem; margin-bottom: 5px;">Age</div>
                    <div style="font-weight: 600;">${appointment.age || 'N/A'}</div>
                  </div>
                  <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                    <div style="color: #666; font-size: 0.9rem; margin-bottom: 5px;">Gender</div>
                    <div style="font-weight: 600;">${appointment.gender || 'N/A'}</div>
                  </div>
                </div>
                
                <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                  <div style="color: #666; font-size: 0.9rem; margin-bottom: 5px;">Blood Group</div>
                  <div style="font-weight: 600;">${appointment.bloodGroup || 'N/A'}</div>
                </div>
                
                <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                  <div style="color: #666; font-size: 0.9rem; margin-bottom: 5px;">Email</div>
                  <div style="font-weight: 600;">${patientEmail}</div>
                </div>
                
                <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                  <div style="color: #666; font-size: 0.9rem; margin-bottom: 5px;">Contact Number</div>
                  <div style="font-weight: 600;">${patientContact}</div>
                </div>
                
                <h3 style="color: #ff8800; margin-top: 10px;">Doctor Information</h3>
                
                <div style="background: #e6f7ff; padding: 15px; border-radius: 8px; border-left: 4px solid #0077b6;">
                  <div style="color: #0077b6; font-size: 0.9rem; margin-bottom: 5px;">Doctor Name</div>
                  <div style="font-weight: 600; font-size: 1.1rem;">${doctorName}</div>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                  <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                    <div style="color: #666; font-size: 0.9rem; margin-bottom: 5px;">Specialization</div>
                    <div style="font-weight: 600;">${doctorSpec}</div>
                  </div>
                  <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                    <div style="color: #666; font-size: 0.9rem; margin-bottom: 5px;">Email</div>
                    <div style="font-weight: 600; font-size: 0.85rem;">${doctorEmail}</div>
                  </div>
                </div>
                
                <h3 style="color: #ff8800; margin-top: 10px;">Appointment Details</h3>
                
                <div style="background: #fff3cd; padding: 15px; border-radius: 8px; border-left: 4px solid #ffc107;">
                  <div style="color: #856404; font-size: 0.9rem; margin-bottom: 5px;">Disease / Concern</div>
                  <div style="font-weight: 600; color: #856404;">${appointment.disease || appointment.specialization || 'N/A'}</div>
                </div>
                
                ${appointment.symptoms && appointment.symptoms.length > 0 ? `
                  <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                    <div style="color: #666; font-size: 0.9rem; margin-bottom: 5px;">Symptoms</div>
                    <div style="font-weight: 600;">${appointment.symptoms.join(', ')}</div>
                  </div>
                ` : ''}
                
                <div style="background: #f0f9ff; padding: 15px; border-radius: 8px; border-left: 4px solid #0ea5e9;">
                  <div style="color: #0ea5e9; font-size: 0.9rem; margin-bottom: 5px;">Appointment Schedule</div>
                  <div style="font-weight: 600;">
                    📅 ${date} at ${time}<br/>
                    🏥 ${appointment.hospital}<br/>
                    📊 Status: <span style="color: #ff8800;">${appointment.status}</span>
                  </div>
                </div>
                
                ${appointment.notes ? `
                  <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                    <div style="color: #666; font-size: 0.9rem; margin-bottom: 5px;">Notes</div>
                    <div style="font-weight: 600;">${appointment.notes}</div>
                  </div>
                ` : ''}
              </div>
              
              <button onclick="this.closest('div[style*=fixed]').remove()" style="margin-top: 20px; width: 100%; padding: 12px; background: #ff8800; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem;">
                Close
              </button>
            </div>
          </div>
        `;
        
        document.body.insertAdjacentHTML('beforeend', modalContent);
      }

      // Refresh appointments
      async function refreshAppointments() {
        await loadAppointments();
      }

      // Load dashboard on page load
      loadDashboard();
    </script>
  </body>
</html>

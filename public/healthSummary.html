<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Health Summary | Smart HealthCare</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: #f5f9ff;
        margin: 0;
        color: #333;
      }

      header {
        background: linear-gradient(135deg, #00b4d8, #0077b6);
        color: white;
        padding: 20px;
        text-align: center;
        font-size: 1.6rem;
        font-weight: 600;
      }

      .container {
        max-width: 850px;
        margin: 50px auto;
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        padding: 40px 50px;
        transition: transform 0.3s ease;
      }

      .container:hover {
        transform: translateY(-5px);
      }

      h2 {
        color: #0077b6;
        text-align: center;
        margin-bottom: 20px;
      }

      .info p {
        font-size: 1.05rem;
        margin: 8px 0;
      }

      .symptom-list {
        background: #f1faff;
        border-radius: 10px;
        padding: 15px;
        margin-top: 15px;
      }

      .advice {
        margin-top: 25px;
        background: #e0f7fa;
        border-left: 5px solid #0077b6;
        padding: 15px;
        border-radius: 10px;
        font-size: 1rem;
        line-height: 1.5;
      }

      .btn-group {
        display: flex;
        justify-content: space-between;
        margin-top: 40px;
      }

      .btn {
        background: #0077b6;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 10px;
        width: 48%;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        transition: 0.3s;
      }

      .btn:hover {
        background: #023e8a;
      }

      .logout {
        background: #dc3545;
      }

      .logout:hover {
        background: #b02a37;
      }
    </style>
  </head>
  <body>
    <header>🩺 Health Summary Report</header>

    <div class="container">
      <h2>Patient Health Summary</h2>
      <div class="info">
        <p><strong>Name:</strong> <span id="pName"></span></p>
        <p><strong>Age:</strong> <span id="pAge"></span></p>
        <p><strong>Gender:</strong> <span id="pGender"></span></p>
        <p><strong>Blood Group:</strong> <span id="pBlood"></span></p>
      </div>

      <div class="symptom-list">
        <h3>🩹 Reported Symptoms:</h3>
        <ul id="pSymptoms"></ul>
      </div>

      <div class="advice" id="adviceBox"></div>

      <div class="btn-group">
        <button class="btn" onclick="window.location.href='appointment.html'">
          📅 Book Appointment
        </button>
        <button class="btn logout" onclick="logout()">🚪 Logout</button>
      </div>

      <div class="btn-group" style="margin-top: 20px">
        <button
          class="btn"
          style="background: #48cae4"
          onclick="window.location.href='patient.html'"
        >
          🏠 Go Back Home
        </button>
      </div>
    </div>

    <script>
      const data = JSON.parse(localStorage.getItem("patientChecklist"));
      if (!data) {
        window.location.href = "systemChecklist.html";
      }

      document.getElementById("pName").textContent = data.name;
      document.getElementById("pAge").textContent = data.age;
      document.getElementById("pGender").textContent = data.gender;
      document.getElementById("pBlood").textContent = data.bloodGroup;

      const list = document.getElementById("pSymptoms");
      data.symptoms.forEach((s) => {
        const li = document.createElement("li");
        li.textContent = s;
        list.appendChild(li);
      });

      // Generate advice based on symptoms
      let advice = "";
      if (data.symptoms.includes("Fever") && data.symptoms.includes("Cough")) {
        advice =
          "Possible flu or viral infection detected. Stay hydrated, take rest, and avoid contact with others. Please consult if symptoms persist.";
      } else if (data.symptoms.includes("Chest Pain")) {
        advice =
          "⚠️ Chest pain detected. Immediate medical evaluation is strongly advised.";
      } else if (
        data.symptoms.includes("Headache") &&
        data.symptoms.includes("Dizziness")
      ) {
        advice =
          "Mild neurological symptoms found. Ensure proper hydration and rest. If persistent, consult a neurologist.";
      } else if (data.symptoms.length > 5) {
        advice =
          "Multiple symptoms found. It's advisable to consult a doctor for a detailed diagnosis and lab tests.";
      } else {
        advice =
          "Symptoms are mild. Maintain good diet, sleep, and hydration. Monitor your health regularly.";
      }

      document.getElementById(
        "adviceBox"
      ).innerHTML = `<strong>🩺 Doctor's Preliminary Advice:</strong><br>${advice}`;

      // Logout function
      function logout() {
        localStorage.clear();
        alert("You have successfully logged out!");
        window.location.href = "login.html";
      }
    </script>
  </body>
</html>

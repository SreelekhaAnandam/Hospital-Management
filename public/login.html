<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(120deg, #cce5ff, #e6fff5);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        h1 {
            margin-bottom: 30px;
            color: #0077b6;
            font-size: 2rem;
        }
        
        .message {
            min-height: 25px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #b00020;
        }
        
        .message.success {
            color: #007700;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border 0.2s;
        }
        
        input:focus, select:focus {
            border-color: #0077b6;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: #0077b6;
            color: white;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            margin-top: 10px;
        }
        
        button:hover:not(:disabled) {
            background: #023e8a;
            transform: translateY(-2px);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .footer {
            margin-top: 25px;
            color: #666;
            font-size: 0.9rem;
        }
        
        .footer a {
            color: #0077b6;
            text-decoration: none;
            font-weight: 600;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🏥 Login Portal</h1>
        
        <div id="message" class="message"></div>
        
        <form id="loginForm" onsubmit="return false;">
            <div class="form-group">
                <label for="role">Select Role:</label>
                <select id="role" name="role" required>
                    <option value="">-- Select Role --</option>
                    <option value="patient" selected>Patient</option>
                    <option value="doctor">Doctor</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <button type="button" id="loginBtn" onclick="handleLogin()">Login</button>
        </form>

        <div class="footer">
            <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
            <p style="margin-top: 10px;">© 2025 Hospital Management System</p>
        </div>
    </div>

    <script>
        // Show message to user
        function showMessage(text, isSuccess = false) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = isSuccess ? 'message success' : 'message';
            console.log((isSuccess ? 'SUCCESS: ' : 'ERROR: ') + text);
        }

        // Login handler
        async function handleLogin() {
            console.log('=== LOGIN ATTEMPT STARTED ===');
            
            const loginBtn = document.getElementById('loginBtn');
            const role = document.getElementById('role').value;
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            // Validation
            if (!role) {
                showMessage('Please select your role');
                return;
            }

            if (!username) {
                showMessage('Please enter your username');
                return;
            }

            if (!password) {
                showMessage('Please enter your password');
                return;
            }

            // Disable button
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';
            showMessage('Connecting to server...', true);

            try {
                const apiBase = 'http://localhost:5000';
                const loginData = { username, password, role };
                
                console.log('Sending login request:', loginData);
                console.log('API URL:', `${apiBase}/api/auth/login`);

                const response = await fetch(`${apiBase}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(loginData)
                });

                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);

                if (response.ok && data.token) {
                    // Success!
                    showMessage('Login successful! Redirecting...', true);
                    
                    // Save to sessionStorage
                    const userData = {
                        id: data.user.id,
                        username: data.user.username,
                        role: data.user.role,
                        name: data.user.name,
                        token: data.token
                    };
                    
                    sessionStorage.setItem('loggedInUser', JSON.stringify(userData));
                    console.log('Saved to sessionStorage:', userData);
                    
                    // Redirect based on role
                    setTimeout(() => {
                        let redirectUrl;
                        if (role === 'patient') {
                            redirectUrl = `${apiBase}/patient.html`;
                        } else if (role === 'doctor') {
                            redirectUrl = `${apiBase}/doctor.html`;
                        } else if (role === 'admin') {
                            redirectUrl = `${apiBase}/admin.html`;
                        }
                        
                        console.log('Redirecting to:', redirectUrl);
                        window.location.href = redirectUrl;
                    }, 1000);
                    
                } else {
                    // Login failed
                    showMessage(data.message || 'Invalid credentials. Please try again.');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                }

            } catch (error) {
                console.error('Login error:', error);
                showMessage('Cannot connect to server. Please make sure the server is running.');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        }

        // Allow Enter key to submit
        document.getElementById('loginForm').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleLogin();
            }
        });

        console.log('Login page loaded successfully');
        console.log('Server URL: http://localhost:5000');
    </script>
</body>
</html>

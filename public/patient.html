<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #e0f7fa, #ffffff);
        text-align: center;
        padding: 60px;
      }
      h1 {
        color: #0077b6;
        font-weight: 700;
        margin-bottom: 10px;
      }
      p {
        color: #333;
        font-size: 1rem;
      }
      .btn {
        background: #0077b6;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        margin: 15px;
        font-size: 1rem;
        transition: 0.3s;
      }
      .btn:hover {
        background: #023e8a;
      }
    </style>
  </head>
  <body>
    <h1>Welcome to Patient Dashboard 👨‍⚕️</h1>
    <p>Manage your appointments and health records from here.</p>

    <button class="btn" onclick="goToAppointments()">Book Appointment</button>
    <button class="btn" onclick="goToChecklist()">System Checklist</button>
    <br /><br />
    <button class="btn" onclick="logout()">Logout</button>

    <script>
      const user = JSON.parse(sessionStorage.getItem("loggedInUser"));
      if (!user || user.role !== "patient") {
        window.location.href = "http://localhost:5000/login.html";
      }

      function goToAppointments() {
        window.location.href = "http://localhost:5000/appointment.html";
      }
      function goToChecklist() {
        window.location.href = "http://localhost:5000/dashboard.html";
      }
      function logout() {
        sessionStorage.clear();
        window.location.href = "http://localhost:5000/login.html";
      }
    </script>
  </body>
</html>

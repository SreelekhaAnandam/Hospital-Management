<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hospital Management System</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(120deg, #cce5ff, #e6fff5);
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      h1 {
        color: #0077b6;
        font-size: 2.2rem;
        margin-bottom: 10px;
      }
      p {
        color: #333;
        max-width: 500px;
        line-height: 1.6;
        margin-bottom: 30px;
      }
      button {
        background: #0077b6;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px 25px;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.3s;
        font-weight: 600;
      }
      button:hover {
        background: #023e8a;
      }
      footer {
        position: absolute;
        bottom: 15px;
        color: #555;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <h1>Welcome to Hospital Management System</h1>
    <p>
      Streamline patient appointments, doctor scheduling, and admin management —
      all in one place. Please log in to continue.
    </p>
    <button onclick="window.location.href='login.html'">Login</button>

    <footer>© 2025 Hospital Management System</footer>
  </body>
</html>

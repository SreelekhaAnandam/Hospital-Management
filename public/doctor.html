<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctor Dashboard | Smart HealthCare</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        background: #f5f9ff;
      }

      header {
        background: linear-gradient(135deg, #0077b6, #00b4d8);
        color: white;
        text-align: center;
        padding: 20px;
        font-size: 1.6rem;
        font-weight: 600;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      .container {
        padding: 30px;
        max-width: 1400px;
        margin: 0 auto;
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: #0077b6;
        font-size: 1.2rem;
      }

      .profile-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        padding: 30px;
        margin-bottom: 30px;
      }

      .profile-header {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
      }

      .profile-pic {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: linear-gradient(135deg, #0077b6, #00b4d8);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        color: white;
        margin-right: 25px;
        flex-shrink: 0;
      }

      .profile-info h2 {
        color: #0077b6;
        font-size: 1.8rem;
        margin-bottom: 10px;
      }

      .profile-details {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 15px;
        margin-top: 20px;
      }

      .detail-item {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 10px;
        border-left: 4px solid #0077b6;
      }

      .detail-label {
        font-size: 0.85rem;
        color: #666;
        margin-bottom: 5px;
      }

      .detail-value {
        font-weight: 600;
        color: #333;
        font-size: 1rem;
      }

      .hospitals-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 5px;
      }

      .hospital-tag {
        background: #0077b6;
        color: white;
        padding: 5px 12px;
        border-radius: 15px;
        font-size: 0.85rem;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .stat-card {
        background: white;
        text-align: center;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s;
      }

      .stat-card:hover {
        transform: translateY(-5px);
      }

      .stat-card h3 {
        color: #0077b6;
        font-size: 1.1rem;
        margin-bottom: 10px;
      }

      .stat-card p {
        font-size: 2rem;
        font-weight: 700;
        color: #023e8a;
      }

      .section {
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        padding: 30px;
        margin-bottom: 30px;
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .section h2 {
        color: #0077b6;
        font-size: 1.5rem;
      }

      .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.95rem;
        transition: 0.3s;
      }

      .btn-primary {
        background: #0077b6;
        color: white;
      }

      .btn-primary:hover {
        background: #023e8a;
      }

      .btn-success {
        background: #28a745;
        color: white;
      }

      .btn-success:hover {
        background: #218838;
      }

      .btn-danger {
        background: #dc3545;
        color: white;
      }

      .btn-danger:hover {
        background: #c82333;
      }

      .btn-secondary {
        background: #6c757d;
        color: white;
      }

      .btn-secondary:hover {
        background: #5a6268;
      }

      .btn-small {
        padding: 6px 12px;
        font-size: 0.85rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.95rem;
      }

      th,
      td {
        padding: 12px;
        border-bottom: 1px solid #eee;
        text-align: left;
      }

      th {
        background: #0077b6;
        color: white;
        font-weight: 600;
      }

      tr:hover {
        background: #f1faff;
      }

      .status-badge {
        padding: 5px 12px;
        border-radius: 15px;
        font-size: 0.85rem;
        font-weight: 600;
      }

      .status-pending {
        background: #fff3cd;
        color: #856404;
      }

      .status-confirmed {
        background: #d4edda;
        color: #155724;
      }

      .status-cancelled {
        background: #f8d7da;
        color: #721c24;
      }

      .availability-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }

      .day-slot {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 12px;
        border-left: 4px solid #0077b6;
      }

      .day-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }

      .day-name {
        font-weight: 600;
        color: #0077b6;
        font-size: 1.1rem;
      }

      .toggle-switch {
        position: relative;
        width: 50px;
        height: 24px;
      }

      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .toggle-slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        transition: 0.4s;
        border-radius: 24px;
      }

      .toggle-slider:before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: 0.4s;
        border-radius: 50%;
      }

      .toggle-switch input:checked + .toggle-slider {
        background-color: #0077b6;
      }

      .toggle-switch input:checked + .toggle-slider:before {
        transform: translateX(26px);
      }

      .time-slots {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .time-slot-row {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .time-slot-row select {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 0.95rem;
        background: white;
      }

      .time-slot-row label {
        font-size: 0.9rem;
        color: #666;
        min-width: 40px;
      }

      .add-slot-btn {
        margin-top: 10px;
        padding: 8px 15px;
        background: #28a745;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.85rem;
      }

      .add-slot-btn:hover {
        background: #218838;
      }

      .slot-disabled {
        opacity: 0.5;
        pointer-events: none;
      }

      .empty-state {
        text-align: center;
        padding: 40px;
        color: #666;
      }

      .empty-state-icon {
        font-size: 3rem;
        margin-bottom: 15px;
      }

      .action-buttons {
        display: flex;
        gap: 8px;
      }

      @media (max-width: 768px) {
        .container {
          padding: 15px;
        }

        .profile-header {
          flex-direction: column;
          text-align: center;
        }

        .profile-pic {
          margin-right: 0;
          margin-bottom: 15px;
        }

        .stats {
          grid-template-columns: 1fr;
        }

        table {
          font-size: 0.85rem;
        }

        th, td {
          padding: 8px;
        }
      }
    </style>
  </head>
  <body>
    <header>🩺 Doctor Professional Dashboard</header>

    <div class="container">
      <div id="loadingBox" class="loading" style="display: none;">
        Loading your dashboard...
      </div>

      <!-- Profile Card -->
      <div id="profileCard" class="profile-card" style="display: none;">
        <div class="profile-header">
          <div class="profile-pic">👨‍⚕️</div>
          <div class="profile-info">
            <h2>Dr. <span id="doctorName">Loading...</span></h2>
            <p style="color: #666; margin-top: 5px;">
              License: <span id="licenseNumber">-</span>
            </p>
          </div>
        </div>

        <div class="profile-details">
          <div class="detail-item">
            <div class="detail-label">Specialization</div>
            <div class="detail-value" id="specialization">-</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Experience</div>
            <div class="detail-value"><span id="experience">0</span> years</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Rating</div>
            <div class="detail-value">⭐ <span id="rating">0</span>/5</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Email</div>
            <div class="detail-value" id="email">-</div>
          </div>
          <div class="detail-item" style="grid-column: 1 / -1;">
            <div class="detail-label">Hospitals</div>
            <div class="hospitals-list" id="hospitalsList"></div>
          </div>
        </div>
      </div>

      <!-- Statistics -->
      <div class="stats" id="statsSection" style="display: none;">
        <div class="stat-card">
          <h3>📅 Total Appointments</h3>
          <p id="totalAppointments">0</p>
        </div>
        <div class="stat-card">
          <h3>⏳ Pending</h3>
          <p id="pendingCount">0</p>
        </div>
        <div class="stat-card">
          <h3>✅ Confirmed</h3>
          <p id="confirmedCount">0</p>
        </div>
        <div class="stat-card">
          <h3>❌ Cancelled</h3>
          <p id="cancelledCount">0</p>
        </div>
      </div>

      <!-- Appointments Section -->
      <div class="section" id="appointmentsSection" style="display: none;">
        <div class="section-header">
          <h2>📋 Patient Appointments</h2>
          <button class="btn btn-primary" onclick="refreshAppointments()">
            🔄 Refresh
          </button>
        </div>
        <div id="appointmentsContent"></div>
      </div>


      <!-- Action Buttons -->
      <div style="text-align: center; margin-top: 30px;">
        <button class="btn btn-danger" onclick="logout()">🚪 Logout</button>
      </div>
    </div>

    <script src="js/api.js?v=2"></script>
    <script>
      // Check authentication
      if (!requireAuth('doctor')) {
        // Will redirect if not authenticated
      }

      let doctorProfile = null;
      let appointments = [];

      // Load dashboard data
      async function loadDashboard() {
        const loadingBox = document.getElementById('loadingBox');
        loadingBox.style.display = 'block';

        try {
          // Load doctor profile
          await loadDoctorProfile();

          // Load appointments
          await loadAppointments();

          // Show sections
          document.getElementById('profileCard').style.display = 'block';
          document.getElementById('statsSection').style.display = 'grid';
          document.getElementById('appointmentsSection').style.display = 'block';

        } catch (error) {
          console.error('Error loading dashboard:', error);
          alert('Error loading dashboard. Please try again.');
        } finally {
          loadingBox.style.display = 'none';
        }
      }

      // Load doctor profile
      async function loadDoctorProfile() {
        try {
          doctorProfile = await DoctorAPI.getProfile();
          console.log('Doctor Profile:', doctorProfile);

          // Update profile display
          document.getElementById('doctorName').textContent = doctorProfile.name || 'Unknown';
          document.getElementById('licenseNumber').textContent = doctorProfile.licenseNumber || '-';
          document.getElementById('specialization').textContent = doctorProfile.specialization || '-';
          document.getElementById('experience').textContent = doctorProfile.experience || 0;
          document.getElementById('rating').textContent = doctorProfile.rating?.toFixed(1) || '0.0';
          document.getElementById('email').textContent = doctorProfile.email || '-';

          // Display hospitals
          const hospitalsList = document.getElementById('hospitalsList');
          if (doctorProfile.hospitals && doctorProfile.hospitals.length > 0) {
            hospitalsList.innerHTML = doctorProfile.hospitals
              .map(h => `<span class="hospital-tag">${h}</span>`)
              .join('');
          } else {
            hospitalsList.innerHTML = '<span style="color: #666;">No hospitals assigned</span>';
          }

        } catch (error) {
          console.error('Error loading doctor profile:', error);
          throw error;
        }
      }

      // Load appointments
      async function loadAppointments() {
        try {
          // Use getMy() to get appointments for current doctor
          appointments = await AppointmentAPI.getMy();
          console.log('My Appointments:', appointments);

          // Update statistics
          document.getElementById('totalAppointments').textContent = appointments.length;
          document.getElementById('pendingCount').textContent = 
            appointments.filter(a => a.status === 'Pending').length;
          document.getElementById('confirmedCount').textContent = 
            appointments.filter(a => a.status === 'Confirmed').length;
          document.getElementById('cancelledCount').textContent = 
            appointments.filter(a => a.status === 'Cancelled').length;

          // Display appointments
          displayAppointments(appointments);

        } catch (error) {
          console.error('Error loading appointments:', error);
          document.getElementById('appointmentsContent').innerHTML = 
            '<div class="empty-state"><div class="empty-state-icon">⚠️</div><p>Error loading appointments</p></div>';
        }
      }

      // Display appointments
      function displayAppointments(myAppointments) {
        const content = document.getElementById('appointmentsContent');

        if (myAppointments.length === 0) {
          content.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📅</div>
              <p>No appointments yet</p>
            </div>
          `;
          return;
        }

        let html = `
          <table>
            <thead>
              <tr>
                <th>Patient Name</th>
                <th>Age/Gender</th>
                <th>Disease</th>
                <th>Hospital</th>
                <th>Date & Time</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
        `;

        myAppointments.forEach(apt => {
          const statusClass = `status-${apt.status.toLowerCase()}`;
          const patientName = apt.patientId?.name || apt.patientName || 'Unknown Patient';
          const date = apt.appointmentDate ? new Date(apt.appointmentDate).toLocaleDateString() : (apt.meetingDate || 'N/A');
          const time = apt.appointmentTime || apt.time || 'N/A';
          const age = apt.age || 'N/A';
          const gender = apt.gender || 'N/A';
          const disease = apt.disease || apt.specialization || 'N/A';

          html += `
            <tr>
              <td><strong>${patientName}</strong></td>
              <td>${age} / ${gender}</td>
              <td>${disease}</td>
              <td>${apt.hospital}</td>
              <td>${date}<br/><small>${time}</small></td>
              <td><span class="status-badge ${statusClass}">${apt.status}</span></td>
              <td>
                <div class="action-buttons">
                  <button class="btn btn-primary btn-small" onclick="viewPatientDetails('${apt._id}')">
                    👁️ View
                  </button>
                  ${apt.status === 'Pending' ? `
                    <button class="btn btn-success btn-small" onclick="updateAppointmentStatus('${apt._id}', 'Confirmed')">
                      ✓ Confirm
                    </button>
                    <button class="btn btn-danger btn-small" onclick="updateAppointmentStatus('${apt._id}', 'Cancelled')">
                      ✗ Cancel
                    </button>
                  ` : ''}
                </div>
              </td>
            </tr>
          `;
        });

        html += '</tbody></table>';
        content.innerHTML = html;
      }

      // Update appointment status
      async function updateAppointmentStatus(appointmentId, status) {
        try {
          await AppointmentAPI.updateStatus(appointmentId, status);
          alert(`Appointment ${status.toLowerCase()} successfully!`);
          await loadAppointments();
        } catch (error) {
          console.error('Error updating appointment:', error);
          alert('Error updating appointment. Please try again.');
        }
      }

      // Refresh appointments
      async function refreshAppointments() {
        await loadAppointments();
      }

      // View patient details in modal
      function viewPatientDetails(appointmentId) {
        const appointment = appointments.find(apt => apt._id === appointmentId);
        if (!appointment) {
          alert('Appointment not found');
          return;
        }

        const patientName = appointment.patientId?.name || appointment.patientName || 'Unknown';
        const patientEmail = appointment.patientId?.email || 'N/A';
        const patientContact = appointment.patientId?.contactNumber || 'N/A';
        const date = appointment.appointmentDate ? new Date(appointment.appointmentDate).toLocaleDateString() : (appointment.meetingDate || 'N/A');
        const time = appointment.appointmentTime || appointment.time || 'N/A';
        
        const modalContent = `
          <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000;" onclick="this.remove()">
            <div style="background: white; padding: 30px; border-radius: 15px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto;" onclick="event.stopPropagation()">
              <h2 style="color: #0077b6; margin-bottom: 20px;">👤 Patient Details</h2>
              
              <div style="display: grid; gap: 15px;">
                <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; border-left: 4px solid #0077b6;">
                  <div style="color: #666; font-size: 0.9rem; margin-bottom: 5px;">Patient Name</div>
                  <div style="font-weight: 600; font-size: 1.1rem;">${patientName}</div>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                  <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                    <div style="color: #666; font-size: 0.9rem; margin-bottom: 5px;">Age</div>
                    <div style="font-weight: 600;">${appointment.age || 'N/A'}</div>
                  </div>
                  <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                    <div style="color: #666; font-size: 0.9rem; margin-bottom: 5px;">Gender</div>
                    <div style="font-weight: 600;">${appointment.gender || 'N/A'}</div>
                  </div>
                </div>
                
                <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                  <div style="color: #666; font-size: 0.9rem; margin-bottom: 5px;">Blood Group</div>
                  <div style="font-weight: 600;">${appointment.bloodGroup || 'N/A'}</div>
                </div>
                
                <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                  <div style="color: #666; font-size: 0.9rem; margin-bottom: 5px;">Email</div>
                  <div style="font-weight: 600;">${patientEmail}</div>
                </div>
                
                <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                  <div style="color: #666; font-size: 0.9rem; margin-bottom: 5px;">Contact Number</div>
                  <div style="font-weight: 600;">${patientContact}</div>
                </div>
                
                <div style="background: #fff3cd; padding: 15px; border-radius: 8px; border-left: 4px solid #ffc107;">
                  <div style="color: #856404; font-size: 0.9rem; margin-bottom: 5px;">Disease / Concern</div>
                  <div style="font-weight: 600; color: #856404;">${appointment.disease || appointment.specialization || 'N/A'}</div>
                </div>
                
                ${appointment.symptoms && appointment.symptoms.length > 0 ? `
                  <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                    <div style="color: #666; font-size: 0.9rem; margin-bottom: 5px;">Symptoms</div>
                    <div style="font-weight: 600;">${appointment.symptoms.join(', ')}</div>
                  </div>
                ` : ''}
                
                <div style="background: #e6f7ff; padding: 15px; border-radius: 8px; border-left: 4px solid #0077b6;">
                  <div style="color: #0077b6; font-size: 0.9rem; margin-bottom: 5px;">Appointment Details</div>
                  <div style="font-weight: 600;">
                    📅 ${date} at ${time}<br/>
                    🏥 ${appointment.hospital}<br/>
                    📊 Status: ${appointment.status}
                  </div>
                </div>
                
                ${appointment.notes ? `
                  <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                    <div style="color: #666; font-size: 0.9rem; margin-bottom: 5px;">Notes</div>
                    <div style="font-weight: 600;">${appointment.notes}</div>
                  </div>
                ` : ''}
              </div>
              
              <button onclick="this.closest('div[style*=fixed]').remove()" style="margin-top: 20px; width: 100%; padding: 12px; background: #0077b6; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem;">
                Close
              </button>
            </div>
          </div>
        `;
        
        document.body.insertAdjacentHTML('beforeend', modalContent);
      }

      // Load dashboard on page load
      loadDashboard();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctor Dashboard | Smart HealthCare</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: #f5f9ff;
        margin: 0;
      }

      header {
        background: linear-gradient(135deg, #0077b6, #00b4d8);
        color: white;
        text-align: center;
        padding: 20px;
        font-size: 1.6rem;
        font-weight: 600;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      .container {
        padding: 30px 60px;
      }

      .profile-card {
        display: flex;
        align-items: center;
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        padding: 25px;
        margin-bottom: 30px;
      }

      .profile-pic {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: #e0f7fa;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        color: #0077b6;
        margin-right: 20px;
      }

      .profile-details h2 {
        margin: 0;
        color: #0077b6;
        font-size: 1.5rem;
      }

      .stats {
        display: flex;
        gap: 20px;
        margin-bottom: 30px;
      }

      .stat-card {
        background: white;
        flex: 1;
        text-align: center;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      }

      .stat-card h3 {
        color: #0077b6;
        font-size: 1.3rem;
      }

      .stat-card p {
        font-size: 1.8rem;
        margin: 5px 0 0;
        font-weight: 700;
        color: #023e8a;
      }

      .appointments {
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        padding: 30px;
      }

      .appointments h2 {
        color: #0077b6;
        margin-bottom: 15px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.95rem;
      }

      th,
      td {
        padding: 12px 10px;
        border-bottom: 1px solid #eee;
        text-align: left;
      }

      th {
        background: #0077b6;
        color: white;
      }

      tr:hover {
        background: #f1faff;
      }

      .btn {
        padding: 7px 15px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.3s;
      }

      .btn.view {
        background: #2a9d8f;
        color: white;
      }

      .btn.view:hover {
        background: #21867a;
      }

      .logout-btn {
        margin-top: 30px;
        background: #0077b6;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
      }

      .logout-btn:hover {
        background: #023e8a;
      }
    </style>
  </head>
  <body>
    <header>🩺 Doctor Professional Dashboard</header>

    <div class="container">
      <div class="profile-card">
        <div class="profile-pic">👨‍⚕️</div>
        <div class="profile-details">
          <h2>Dr. <span id="doctorName">[Name]</span></h2>
          <p>
            <strong>Specialization:</strong>
            <span id="doctorSpecialization">General Medicine</span>
          </p>
          <p>
            <strong>Hospital:</strong>
            <span id="doctorHospital">[Hospital]</span>
          </p>
          <p><strong>Date:</strong> <span id="date"></span></p>
        </div>
      </div>

      <div class="stats">
        <div class="stat-card">
          <h3>📅 Total Appointments</h3>
          <p id="totalAppointments">0</p>
        </div>
        <div class="stat-card">
          <h3>✅ Approved</h3>
          <p id="approvedCount">0</p>
        </div>
        <div class="stat-card">
          <h3>❌ Rejected</h3>
          <p id="rejectedCount">0</p>
        </div>
      </div>

      <div class="appointments">
        <h2>Patient Appointment List</h2>
        <table id="appointmentTable">
          <thead>
            <tr>
              <th>Patient Name</th>
              <th>Age</th>
              <th>Gender</th>
              <th>Disease / Department</th>
              <th>Hospital</th>
              <th>Meeting Date</th>
              <th>Time</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="appointmentBody"></tbody>
        </table>
      </div>

      <center>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </center>
    </div>

    <script>
      const doctor = JSON.parse(sessionStorage.getItem("loggedInUser"));
      document.getElementById("doctorName").textContent = doctor
        ? doctor.username
        : "John Smith";
      document.getElementById("doctorHospital").textContent = doctor
        ? doctor.hospital || "Not Assigned"
        : "Not Assigned";
      document.getElementById("doctorSpecialization").textContent = doctor
        ? doctor.specialization || "General Medicine"
        : "General Medicine";
      document.getElementById("date").textContent =
        new Date().toLocaleDateString();

      // Get appointments saved from patient side (healthSummary or appointment confirmation)
      const allAppointments =
        JSON.parse(localStorage.getItem("confirmedAppointments")) || [];

      const body = document.getElementById("appointmentBody");

      function renderAppointments() {
        body.innerHTML = "";
        allAppointments.forEach((appt, index) => {
          const row = document.createElement("tr");
          row.innerHTML = `
          <td>${appt.patientName || "Not Provided"}</td>
          <td>${appt.age || "Not Provided"}</td>
          <td>${appt.gender || "Not Provided"}</td>
          <td>${appt.disease || "Not Provided"}</td>
          <td>${appt.hospital || "Not Provided"}</td>
          <td>${appt.meetingDate || "Not Provided"}</td>
          <td>${appt.time || "Not Provided"}</td>
          <td>${appt.status || "Pending"}</td>
          <td>
            <button class="btn view" onclick="viewSummary(${index})">View Summary</button>
          </td>
        `;
          body.appendChild(row);
        });

        document.getElementById("totalAppointments").textContent =
          allAppointments.length;
        document.getElementById("approvedCount").textContent =
          allAppointments.filter((a) => a.status === "Approved").length;
        document.getElementById("rejectedCount").textContent =
          allAppointments.filter((a) => a.status === "Rejected").length;
      }

      function viewSummary(index) {
        sessionStorage.setItem(
          "selectedPatient",
          JSON.stringify(allAppointments[index])
        );
        window.location.href = "http://localhost:5000/healthSummary.html";
      }

      function logout() {
        sessionStorage.clear();
        window.location.href = "http://localhost:5000/login.html";
      }

      renderAppointments();
    </script>
  </body>
</html>
